# chapter2: 依存性注入とモックによるテスト

[project]
name = "chapter2"
version = "1.0.0"
description = "chapter2: 依存性注入とモックによるテスト"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.42.83",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=src", "--cov-report=term-missing"]
