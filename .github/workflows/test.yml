name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Run tests
        run: |
          uv python install 3.13
          for chapter in chapter1 chapter2 chapter3 chapter4 chapter5; do
            echo "::group::${chapter}"
            cd "${chapter}"
            uv sync --dev
            uv run pytest
            cd ..
            echo "::endgroup::"
          done
