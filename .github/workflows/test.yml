name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        chapter: [chapter1, chapter2, chapter3, chapter4, chapter5]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Run tests
        working-directory: ${{ matrix.chapter }}
        run: |
          uv python install 3.13
          uv sync --dev
          uv run pytest
